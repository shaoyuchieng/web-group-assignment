<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery Page</title>
  <link href="https://cdn.jsdelivr.net/npm/lightbox2@2/dist/css/lightbox.min.css" rel="stylesheet"/>
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>Gallery Page</h1>
    <p>View high-resolution images of interiors, exteriors and facilities</p>
  </header>

  <div class="gallery-nav">
    <button onclick="showCategory('interior')">Interiors</button>
    <button onclick="showCategory('exterior')">Exteriors</button>
    <button onclick="showCategory('amenity')">Amenities</button>
  </div>

  <!-- 室内 -->
  <div class="gallery-section interior">
    <a href="static/image/Living Room 1.jpg" data-lightbox="interior" data-title="Living Room"><img src="static/image/Living Room 1.jpg" alt="Living Room"></a>
    <a href="static/image/Bedroom 1.jpg" data-lightbox="interior" data-title="Bedroom"><img src="static/image/Bedroom 1.jpg" alt="Bedroom"></a>
    <a href="static/image/Kitchen 1.jpg" data-lightbox="interior" data-title="Kitchen"><img src="static/image/Kitchen 1.jpg" alt="Kitchen"></a>
    <a href="static/image/Bathroom 1.jpg" data-lightbox="interior" data-title="Bathroom"><img src="static/image/Bathroom 1.jpg" alt="Bathroom"></a>
    
    <a href="static/image/Living Room 2.jpg" data-lightbox="interior" data-title="Living Room"><img src="static/image/Living Room 2.jpg" alt="Living Room"></a>
    <a href="static/image/Bedroom 2.jpg" data-lightbox="interior" data-title="Bedroom"><img src="static/image/Bedroom 2.jpg" alt="Bedroom"></a>
    <a href="static/image/Dining Room 1.jpg" data-lightbox="interior" data-title="Dining Room"><img src="static/image/Dining Room 1.jpg" alt="Dining Room"></a>
    <a href="static/image/Washroom 1.jpg" data-lightbox="interior" data-title="Washroom"><img src="static/image/Washroom 1.jpg" alt="Washroom"></a>
    
    <a href="static/image/Home Office.jpg" data-lightbox="interior" data-title="Home Office"><img src="static/image/Home Office.jpg" alt="Home Office"></a>
    <a href="static/image/Entrance.jpg" data-lightbox="interior" data-title="Entrance"><img src="static/image/Entrance.jpg" alt="Entrance"></a>
    <a href="static/image/kids room.jpg" data-lightbox="interior" data-title="Kids Room"><img src="static/image/kids room.jpg" alt="Kids Room"></a>
    <a href="static/image/Kitchen.jpg" data-lightbox="interior" data-title="Kitchen"><img src="static/image/Kitchen.jpg" alt="Kitchen"></a>
   
    <a href="static/image/Multipurpose room.jpg" data-lightbox="interior" data-title="Multipurpose Room"><img src="static/image/Multipurpose room.jpg" alt="Multipurpose Room"></a>
    <a href="static/image/Kitchen & Dining Area.jpg" data-lightbox="interior" data-title="Kitchen & Dining Area"><img src="static/image/Kitchen & Dining Area.jpg" alt="Kitchen & Dining Area"></a>
    <a href="static/image/Half Bathroom.jpg" data-lightbox="interior" data-title="Half Bathroom"><img src="static/image/Half Bathroom.jpg" alt="Half Bathroom"></a>
    <a href="static/image/Modern Living Room.jpg" data-lightbox="interior" data-title="Living Room"><img src="static/image/Modern Living Room.jpg" alt="Modern Living Room"></a>
  </div>

  <!-- 室外 -->
  <div class="gallery-section exterior">
    <a href="static/image/Home 1.jpg" data-lightbox="exterior" data-title="House 1"><img src="static/image/Home 1.jpg" alt="House 1"></a>
    <a href="static/image/Home 2.jpg" data-lightbox="exterior" data-title="House 2"><img src="static/image/Home 2.jpg" alt="House 2"></a>
    <a href="static/image/Home 3.jpg" data-lightbox="exterior" data-title="House 3"><img src="static/image/Home 3.jpg" alt="House 3"></a>
    <a href="static/image/Home 4.jpg" data-lightbox="exterior" data-title="House 4"><img src="static/image/Home 4.jpg" alt="House 4"></a>
   
    <a href="static/image/Home 5.jpg" data-lightbox="exterior" data-title="House 5"><img src="static/image/Home 5.jpg" alt="House 5"></a>
    <a href="static/image/Home 6.jpg" data-lightbox="exterior" data-title="House 6"><img src="static/image/Home 6.jpg" alt="House 6"></a>
    <a href="static/image/home 7.jpg" data-lightbox="exterior" data-title="House 7"><img src="static/image/home 7.jpg" alt="House 7"></a>
    <a href="static/image/Home 8.jpg" data-lightbox="exterior" data-title="House 8"><img src="static/image/Home 8.jpg" alt="House 8"></a>
  </div>

  <!-- 设施 -->
  <div class="gallery-section amenity">
    <a href="static/image/Swimming Pool.jpg" data-lightbox="amenity" data-title="Swimming Pool"><img src="static/image/Swimming Pool.jpg" alt="Swimming Pool"></a>
    <a href="static/image/Gym.jpg" data-lightbox="amenity" data-title="Gym"><img src="static/image/Gym.jpg" alt="Gym"></a>
    <a href="static/image/Sport Courts.jpg" data-lightbox="amenity" data-title="Sport Courts"><img src="static/image/Sport Courts.jpg" alt="Sport Courts"></a>
    <a href="static/image/Reading Room.jpg" data-lightbox="amenity" data-title="Reading Room"><img src="static/image/Reading Room.jpg" alt="Reading Room"></a>
    
    <a href="static/image/Entertainment Room.jpg" data-lightbox="amenity" data-title="Billiards Room"><img src="static/image/Entertainment Room.jpg" alt="Billiards Room"></a>
    <a href="static/image/Gaming Room.jpg" data-lightbox="amenity" data-title="Gaming Room"><img src="static/image/Gaming Room.jpg" alt="Gaming Room"></a>
    <a href="static/image/Kids Entertainment Room.jpg" data-lightbox="amenity" data-title="Kids Entertainment Room"><img src="static/image/Kids Entertainment Room.jpg" alt="Kids Entertainment Room"></a>
    <a href="static/image/Sauna Room.jpg" data-lightbox="amenity" data-title="Sauna Room"><img src="static/image/Sauna Room.jpg" alt="Sauna Room"></a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lightbox2@2/dist/js/lightbox-plus-jquery.min.js"></script>
  <script>
    function showCategory(category) {
      const sections = document.querySelectorAll('.gallery-section');
      sections.forEach(section => {
        section.style.display = section.classList.contains(category) ? 'flex' : 'none';
      });
    }
    showCategory('interior'); // 默认显示室内
  </script>
</body>
</html>
